name: AnimalCollector
options:
  bundleIdPrefix: com.animalcollector
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.0.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

targets:
  AnimalCollector:
    type: application
    platform: iOS
    dependencies:
      - package: Kingfisher
      - package: GoogleMobileAds
    sources:
      - path: AnimalCollector
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animalcollector.app
        INFOPLIST_FILE: AnimalCollector/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: "YES"
    scheme:
      testTargets: []
